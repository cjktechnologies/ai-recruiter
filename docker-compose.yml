# Local development stack: `cp .env.example .env && docker compose up --build`
# Web UI: http://localhost:3000   API docs: http://localhost:8000/docs   Mail: http://localhost:8025
name: ai-recruiter

x-backend: &backend
  build: ./backend
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruiter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruiter}
      POSTGRES_DB: recruiter
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruiter"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Google Cloud Storage emulator (same JSON API as GCS; the app reaches it via STORAGE_EMULATOR_HOST).
  gcs:
    image: fsouza/fake-gcs-server:1.56
    command: ["-scheme", "http", "-port", "4443", "-public-host", "gcs:4443", "-backend", "filesystem",
              "-filesystem-root", "/data"]
    volumes: [gcsdata:/data]
    ports: ["4443:4443"]

  gcs-init:
    image: curlimages/curl:8.22.0
    depends_on: [gcs]
    entrypoint: >
      /bin/sh -c "until curl -fsS http://gcs:4443/storage/v1/b > /dev/null; do sleep 1; done;
      curl -sS -X POST -H 'Content-Type: application/json' -d '{\"name\":\"candidate-documents\"}'
      http://gcs:4443/storage/v1/b || true"

  clamav:
    image: clamav/clamav:stable
    profiles: ["full"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      gcs-init: { condition: service_completed_successfully }
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app:celery", "worker", "-Q", "celery,ai", "--loglevel=INFO", "--concurrency=4"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      gcs-init: { condition: service_completed_successfully }

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app:celery", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  redisdata:
  gcsdata:
