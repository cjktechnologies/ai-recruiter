# One-time per cluster, after installing External Secrets Operator into namespace external-secrets
# (release name external-secrets, so its Kubernetes service account is external-secrets/external-secrets).
# GKE Workload Identity gives that service account access to the environment's Secret Manager secrets
# (granted by Terraform); no keys are involved. Replace PROJECT_ID, then:
#   kubectl apply -f deploy/cluster/cluster-secret-store.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
