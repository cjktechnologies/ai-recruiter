[project]
name = "ai-recruiter-backend"
version = "1.0.0"
description = "AI-assisted recruitment operations platform (ATS + CRM + agent orchestration)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "pyjwt[crypto]>=2.8",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "redis>=5.0",
  "celery>=5.4",
  "boto3>=1.34",
  "cryptography>=42",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0", "openai>=1.40", "google-genai>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012", "S105", "S106", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires PostgreSQL",
  "ai_eval: AI evaluation against synthetic datasets",
  "security: security regression tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/celery_app.py"]
