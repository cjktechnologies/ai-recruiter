# Default values. Environment overrides live in values-staging.yaml / values-production.yaml.
image:
  api: { repository: REPLACE_ME/ai-recruiter-api, tag: "latest" }
  web: { repository: REPLACE_ME/ai-recruiter-web, tag: "latest" }
  pullPolicy: IfNotPresent

environment: production
host: recruit.example.com
publicBaseUrl: https://recruit.example.com

# Non-secret configuration (12-factor env vars).
config:
  LOG_LEVEL: INFO
  LLM_PROVIDER: anthropic
  LLM_MODEL: claude-opus-5-5
  LLM_EFFORT: medium
  EMBEDDING_PROVIDER: local
  STORAGE_BACKEND: gcs
  EMAIL_BACKEND: smtp
  SMS_BACKEND: console
  REQUIRE_MALWARE_SCAN: "true"
  CLAMAV_HOST: clamav
  RATE_LIMIT_PER_MINUTE: "300"
  AUTH_RATE_LIMIT_PER_MINUTE: "20"

# Secrets are synced from Google Secret Manager by External Secrets Operator into this Secret. Each
# remote secret is a JSON document:
#   <name>-infra  written by Terraform: DATABASE_URL, REDIS_URL, REDIS_CA_CERT, JWT_SECRET,
#                 GCP_PROJECT_ID, GCS_BUCKET, GCS_KMS_KEY_NAME
#   <name>        written by operators: DATA_ENCRYPTION_KEY, ANTHROPIC_API_KEY, SMTP_*, OIDC_* ...
externalSecret:
  enabled: true
  secretStore: gcp-secret-manager
  remoteKeys: [ai-recruiter-production-infra, ai-recruiter-production]
  refreshInterval: 1h
existingSecretName: ai-recruiter-secrets

serviceAccount:
  annotations: {}
# GKE Workload Identity: the Kubernetes service account acts as this Google service account
# (Cloud Storage access). Terraform output `app_service_account`.
gcp:
  appServiceAccount: ""

# Memorystore in-transit encryption: mount the instance CA (secret key REDIS_CA_CERT) for rediss://.
redisTls:
  enabled: true
  secretKey: REDIS_CA_CERT
  mountPath: /etc/redis-tls

api:
  replicas: 3
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  autoscaling: { enabled: true, min: 3, max: 12, cpu: 65 }
  webConcurrency: 2
worker:
  replicas: 2
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1536Mi } }
  autoscaling: { enabled: true, min: 2, max: 10, cpu: 70 }
  concurrency: 4
web:
  replicas: 2
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  autoscaling: { enabled: true, min: 2, max: 8, cpu: 70 }
clamav:
  enabled: true
  resources: { requests: { cpu: 100m, memory: 1536Mi }, limits: { memory: 2560Mi } }

# GKE Ingress → global external Application Load Balancer with container-native (NEG) backends.
ingress:
  className: ""          # GKE selects its controller with the kubernetes.io/ingress.class annotation
  annotations:
    kubernetes.io/ingress.class: gce
  gke:
    enabled: true
    staticIpName: ""       # global address reserved by Terraform (output `ingress_ip_name`)
    managedCertificate: true   # Google-managed TLS certificate for .Values.host
    sslPolicy: ""          # Terraform output `ssl_policy_name` (TLS 1.2+, MODERN profile)
    securityPolicy: ""     # Cloud Armor policy (Terraform output `security_policy_name`)
    backendTimeoutSec: 120 # long-running AI requests

# Google Cloud Managed Service for Prometheus (enabled on the GKE cluster) or Prometheus Operator.
monitoring:
  provider: gmp          # gmp | prometheus-operator
  serviceMonitor: true
  prometheusRules: true
