# Local development stack: `cp .env.example .env && docker compose up --build`
# Web UI: http://localhost:3000   API docs: http://localhost:8000/docs   Mail: http://localhost:8025
name: ai-recruiter

x-backend: &backend
  build: ./backend
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruiter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruiter}
      POSTGRES_DB: recruiter
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruiter"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [miniodata:/data]
    ports: ["9001:9001"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/candidate-documents; mc anonymous set none local/candidate-documents"

  clamav:
    image: clamav/clamav:stable
    profiles: ["full"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app:celery", "worker", "-Q", "celery,ai", "--loglevel=INFO", "--concurrency=4"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app:celery", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  redisdata:
  miniodata:
