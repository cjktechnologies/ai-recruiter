name: CD

# main → build immutable images → staging (auto) → smoke tests → production (manual approval via
# the GitHub `production` environment) → smoke tests → automatic Helm rollback on failure.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag (git SHA) to redeploy / roll back to"
        required: false

permissions:
  contents: read
  id-token: write   # GitHub OIDC → AWS (no stored cloud credentials)

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  build:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix: { component: [api, web] }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component == 'api' && 'backend' || 'frontend' }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.ecr.outputs.registry }}/ai-recruiter-${{ matrix.component }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy-staging:
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/deploy.yml
    with: { environment: staging, image_tag: "${{ inputs.image_tag || github.sha }}" }
    secrets: inherit

  deploy-production:
    needs: [deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with: { environment: production, image_tag: "${{ inputs.image_tag || github.sha }}" }
    secrets: inherit
