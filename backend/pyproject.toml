[project]
name = "ai-recruiter-backend"
version = "1.0.0"
description = "AI-assisted recruitment operations platform (ATS + CRM + agent orchestration)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "pyjwt[crypto]>=2.8",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "redis>=5.0",
  "celery>=5.4",
  "google-cloud-storage>=3.0",
  "cryptography>=42",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  # LLM provider SDKs (imported lazily; required on Vercel, which installs no optional extras)
  "anthropic>=1.0",
  "openai>=1.40",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

# Vercel (Python runtime): FastAPI app object; dependencies come from uv.lock.
[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
# UP046/UP047: keep typing.Generic/TypeVar (PEP 695 syntax is a style-only rewrite).
ignore = ["S101", "B008", "RUF012", "S105", "S106", "RUF001", "UP046", "UP047"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires PostgreSQL",
  "ai_eval: AI evaluation against synthetic datasets",
  "security: security regression tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/celery_app.py"]
