apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ar.name" . }}
  labels: {{- include "ar.labels" . | nindent 4 }}
  {{- $ann := deepCopy (.Values.serviceAccount.annotations | default dict) }}
  {{- with .Values.gcp.appServiceAccount }}{{ $_ := set $ann "iam.gke.io/gcp-service-account" . }}{{ end }}
  annotations: {{- toYaml $ann | nindent 4 }}
{{- if .Values.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.existingSecretName }}
  labels: {{- include "ar.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef: { name: {{ .Values.externalSecret.secretStore }}, kind: ClusterSecretStore }
  target: { name: {{ .Values.existingSecretName }}, creationPolicy: Owner }
  # Later entries win on duplicate keys: Terraform-managed infra values, then operator-managed secrets.
  dataFrom:
    {{- range .Values.externalSecret.remoteKeys }}
    - extract: { key: {{ . }} }
    {{- end }}
{{- end }}
---
# Database migrations run as a pre-install/pre-upgrade hook: the release only proceeds if they succeed.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ar.name" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "ar.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata: { labels: { app.kubernetes.io/component: migrate } }
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ar.name" . }}
      {{- include "ar.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "ar.apiImage" . }}
          command: ["alembic", "upgrade", "head"]
          env: {{- include "ar.env" . | nindent 12 }}
          envFrom: {{- include "ar.envFrom" . | nindent 12 }}
          {{- include "ar.containerSecurity" . | nindent 10 }}
