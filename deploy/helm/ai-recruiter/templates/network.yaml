{{- $root := . -}}
{{- $gke := .Values.ingress.gke.enabled -}}
{{- range $name, $svc := dict "api" (dict "port" 8000 "health" "/healthz") "web" (dict "port" 3000 "health" "/login") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ar.name" $root }}-{{ $name }}
  labels: {{- include "ar.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  {{- if $gke }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "{{ include "ar.name" $root }}-{{ $name }}"}'
  {{- end }}
spec:
  selector: { app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $name }} }
  ports: [{ name: http, port: {{ $svc.port }}, targetPort: http }]
{{- if $gke }}
---
# Load-balancer backend settings: health check, timeout, Cloud Armor (WAF + rate limiting), logging.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "ar.name" $root }}-{{ $name }}
  labels: {{- include "ar.labels" $root | nindent 4 }}
spec:
  timeoutSec: {{ $root.Values.ingress.gke.backendTimeoutSec }}
  connectionDraining: { drainingTimeoutSec: 30 }
  healthCheck: { type: HTTP, requestPath: {{ $svc.health }}, port: {{ $svc.port }}, checkIntervalSec: 15 }
  logging: { enable: true, sampleRate: 1.0 }
  {{- with $root.Values.ingress.gke.securityPolicy }}
  securityPolicy: { name: {{ . }} }
  {{- end }}
{{- end }}
{{- end }}
{{- if $gke }}
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: {{ include "ar.name" . }}
  labels: {{- include "ar.labels" . | nindent 4 }}
spec:
  redirectToHttps: { enabled: true }
  {{- with .Values.ingress.gke.sslPolicy }}
  sslPolicy: {{ . }}
  {{- end }}
{{- if .Values.ingress.gke.managedCertificate }}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ include "ar.name" . }}
  labels: {{- include "ar.labels" . | nindent 4 }}
spec:
  domains: [{{ .Values.host | quote }}]
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ar.name" . }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- if $gke }}
    networking.gke.io/v1beta1.FrontendConfig: {{ include "ar.name" . }}
    {{- with .Values.ingress.gke.staticIpName }}
    kubernetes.io/ingress.global-static-ip-name: {{ . }}
    {{- end }}
    {{- if .Values.ingress.gke.managedCertificate }}
    networking.gke.io/managed-certificates: {{ include "ar.name" . }}
    {{- end }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          # Only the web tier is public; the API is reached through the web BFF (/api/backend) and
          # candidate-facing /api/v1/public routes.
          - path: /api/v1/public
            pathType: Prefix
            backend: { service: { name: {{ include "ar.name" . }}-api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "ar.name" . }}-web, port: { name: http } } }
---
# Default-deny, then allow only the flows the platform needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ar.name" . }}-default-deny
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} } }
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ar.name" . }}-allow
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} } } }]
    - ports: [{ port: 3000 }, { port: 8000 }]   # from the load balancer (GFE and health-check ranges)
{{- if .Values.clamav.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  labels: {{- include "ar.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: clamav } }
  template:
    metadata:
      labels: { app.kubernetes.io/component: clamav, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:stable
          ports: [{ containerPort: 3310, name: clamd }]
          readinessProbe: { tcpSocket: { port: clamd }, initialDelaySeconds: 60, periodSeconds: 15 }
          resources: {{- toYaml .Values.clamav.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: clamav }
spec:
  selector: { app.kubernetes.io/component: clamav }
  ports: [{ port: 3310, targetPort: clamd }]
{{- end }}
